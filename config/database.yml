# MySQL. Versions 5.5.8 and up are supported.
#
#   gem install mysql2
#
#   Ensure the MySQL 2 gem is defined in your Gemfile
#   gem "mysql2"
#
default: &default
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: root
  password: <%= ENV['MYSQL_PASSWORD'] || '' %>
  host: localhost
  port: 3306

development:
  <<: *default
  database: jwt_lab_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: jwt_lab_test

production:
  primary:
    <<: *default
    database: jwt_lab_production
    username: <%= ENV['MYSQL_USERNAME'] || 'root' %>
    password: <%= ENV['MYSQL_PASSWORD'] %>
    host: <%= ENV['MYSQL_HOST'] || 'localhost' %>
  cache:
    <<: *default
    database: jwt_lab_production_cache
    username: <%= ENV['MYSQL_USERNAME'] || 'root' %>
    password: <%= ENV['MYSQL_PASSWORD'] %>
    host: <%= ENV['MYSQL_HOST'] || 'localhost' %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: jwt_lab_production_queue
    username: <%= ENV['MYSQL_USERNAME'] || 'root' %>
    password: <%= ENV['MYSQL_PASSWORD'] %>
    host: <%= ENV['MYSQL_HOST'] || 'localhost' %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: jwt_lab_production_cable
    username: <%= ENV['MYSQL_USERNAME'] || 'root' %>
    password: <%= ENV['MYSQL_PASSWORD'] %>
    host: <%= ENV['MYSQL_HOST'] || 'localhost' %>
    migrations_paths: db/cable_migrate
